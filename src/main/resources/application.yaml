server:
  port: 4200

spring:
  application:
    name: chatbot
  datasource:
    url: jdbc:h2:file:./data/chatbot
    username: sa
    password:
  jpa:
    hibernate:
      ddl-auto: update
  ai:
    ollama:
      base-url: http://localhost:11434
      chat:
        options:
          model: exaone3.5:2.4b
          temperature: 0.2       # 낮을수록 가장 확률이 높은 단어만 골라서 답이 일관되고 예측 가능, 높을수록 덜 흔한 단어도 골라서 창의적이지만 엉뚱해질 수 있음
          num-predict: 300       # 출력 최대 토큰. 반복 루프가 생겨도 여기서 끊김 모델이 한번엔 생성할 수 있는 최대 토큰 수에요. 토큰은 대략 단어 조각 단위인데, 한국어는 한 글자가 1~2토큰 정도 먹는 경우가 많아서 200~300글자 안팎의 답변
          repeat-penalty: 1.15   # 같은 말 반복에 벌점 (기본 1.1)  이미 나온 단어를 다시 쓰려고 할 때 점수를 깎는 정도 1.0이면 벌점 없음 값이 클수록 같은 단어나 표현의 재사용을 강하게 억제합니다. 작은 모델의 경우 반복이 많아서 점수를 높여줍니다.
          num-ctx: 8192          # 추가: 컨텍스트 윈도우 크기 ollama 기본 값은 2048 토큰인데 FAQ 30개를 통째로 넣으면 이보다 깁니다. 이 설정이 없으면 에러 없이 앞 부분이 잘려서 모델이 FAQ 일부만 보고 답합니다.
      embedding:
        options:
          model: bge-m3   # 실험 B에서 bge-m3로 바꿔볼 예정
faqbot:
  prompt:
    system: classpath:prompts/faq-rag-v1.st
  rag:
    top-k: 3
    similarity-threshold: 0.5     # 처음엔 다 받고, 점수를 보고 정할 예정



# repeat-penalty는 이미 나온 토큰의 점수(logit)를 나누는 방식이라 1.15면 "이미 쓴 단어의 선택 점수를 약 13% 깎는다"는 뜻이에요. 매 토큰마다 반복해서 적용되니까 작은 차이가 누적되면 효과가 커요. 그래서 대략 이렇게 느껴져요.
#
#1.0: 벌점 없음
#1.05~1.1: 약하게 억제 (Ollama 기본값이 1.1)
#1.15~1.2: 꽤 강하게 억제, 작은 모델 반복 방지용으로 흔히 쓰는 범위
#1.3~1.5: 매우 강함, 부작용이 눈에 띄기 시작
#1.5 이상: 문장이 깨지는 경우가 많음
#
#특히 한국어는 조사("은/는/이/가"), 어미(“~요”, “~다”)처럼 정상적인 문장에서도 계속 반복해서 나오는 토큰이 많아요. 벌점을 너무 높이면 이런 필수 토큰까지 억제해서 어색한 문장이 돼요. 그래서 "점수를 올릴수록 반