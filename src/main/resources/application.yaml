server:
  port: 4200

spring:
  application:
    name: chatbot
  datasource:
    url: jdbc:postgresql://localhost:5433/chatbot
    username: chatbot
    password: chatbot
  jpa:
    hibernate:
      ddl-auto: update
  ai:
    ollama:
      base-url: http://localhost:11434
    chat:
      model: llama3.2:3b
      temperature: 0.2
    vectorstore:
      pgvector:
        initialize-schema: true
